<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category|capitalize }} Plants</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-green-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">{{ category|capitalize }} Plants</h1>
            <a href="{{ url_for('index') }}" class="bg-white text-green-600 px-4 py-2 rounded shadow hover:bg-gray-200">⬅ Back</a>
        </div>
    </header>

    <!-- Search -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <input id="search-bar" type="text" placeholder="Search plants..." 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Plant Grid -->
        <div id="plant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for plant in plants %}
            <div class="plant-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer hover:scale-105 transition"
                 data-name="{{ plant.name }}">
                <img src="{{ plant.image }}" alt="{{ plant.name }}" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h3 class="font-semibold text-lg text-gray-800">{{ plant.name }}</h3>
                    <p class="text-sm text-gray-600 mt-2">{{ plant.basics[:60] }}...</p>
                    <a href="{{ url_for('plant', category=category, plant_id=plant.id) }}" 
                       class="text-green-600 mt-3 inline-block hover:underline">View Details →</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
